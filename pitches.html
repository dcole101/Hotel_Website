        <section class="pitch">

          <div class="simple-carousel">
            <img class="active" src="images/pitches/Slide2.PNG" alt="The Neighbours Yard — image 1" />

      </div>
    </div>

    <script>
      // Simple carousels: show one image at a time, no animation.
      document.querySelectorAll(".simple-carousel").forEach(function (carousel) {
        var slides = carousel.querySelectorAll("img");
        var count = carousel.querySelector(".carousel-count");
        var index = 0;

        function show(i) {
          slides[index].classList.remove("active");
          index = (i + slides.length) % slides.length;
          slides[index].classList.add("active");
          count.textContent = index + 1 + " / " + slides.length;
        }

        carousel.querySelectorAll("button[data-dir]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            show(index + Number(btn.dataset.dir));
          });
        });
      });
    </script>
